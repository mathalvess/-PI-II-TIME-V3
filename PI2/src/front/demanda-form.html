<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Demanda - SAD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <!-- Menu de navegacao -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">SAD</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="demandas.html">Demandas</a></li>
                    <li class="nav-item"><a class="nav-link active" href="demanda-form.html">Nova Demanda</a></li>
                </ul>
                <span class="navbar-text me-3">Lucas Marassi (Administrador)</span>
                <a href="index.html" class="btn btn-outline-light btn-sm">Sair</a>
            </div>
        </div>
    </nav>

    <main class="container">

        <h4 id="titulo-pagina">Nova Demanda</h4>
        <p class="text-muted">Preencha os dados da demanda</p>

        <!-- Caixa de aviso (erros da API) -->
        <div id="mensagem"></div>

        <div class="card">
            <div class="card-body">
                <!-- novalidate: as mensagens de erro vem do js/demanda-form-validacao.js -->
                <form id="form-demanda" novalidate>
                    <div class="row">

                        <div class="col-md-12 mb-3">
                            <label for="titulo" class="form-label">Titulo *</label>
                            <input type="text" class="form-control" id="titulo" name="titulo" maxlength="120" required>
                            <div class="invalid-feedback" id="erroTitulo"></div>
                        </div>

                        <div class="col-md-12 mb-3">
                            <label for="descricao" class="form-label">Descricao *</label>
                            <textarea class="form-control" id="descricao" name="descricao" rows="5" required></textarea>
                            <div class="invalid-feedback" id="erroDescricao"></div>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="tipo" class="form-label">Tipo *</label>
                            <select class="form-select" id="tipo" name="tipo" required>
                                <option value="">Selecione</option>
                                <option value="Tarefa">Tarefa</option>
                                <option value="Defeito">Defeito</option>
                                <option value="Melhoria">Melhoria</option>
                                <option value="Documentacao">Documentacao</option>
                            </select>
                            <div class="invalid-feedback" id="erroTipo"></div>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="prioridade" class="form-label">Prioridade *</label>
                            <select class="form-select" id="prioridade" name="prioridade" required>
                                <option value="">Selecione</option>
                                <option value="Critica">Critica</option>
                                <option value="Alta">Alta</option>
                                <option value="Media">Media</option>
                                <option value="Baixa">Baixa</option>
                            </select>
                            <div class="invalid-feedback" id="erroPrioridade"></div>
                        </div>

                        <!-- Toda demanda comeca com status Aberta, por isso o campo fica travado -->
                        <div class="col-md-4 mb-3">
                            <label for="status" class="form-label">Status</label>
                            <input type="text" class="form-control" id="status" name="status" value="Aberta" readonly>
                            <div class="invalid-feedback" id="erroStatus"></div>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="projeto" class="form-label">Projeto *</label>
                            <select class="form-select" id="projeto" name="projeto" required>
                                <option value="">Selecione</option>
                            </select>
                            <div class="invalid-feedback" id="erroProjeto"></div>
                        </div>

                        <!-- O responsavel pode ficar em branco e ser definido depois -->
                        <div class="col-md-4 mb-3">
                            <label for="responsavel" class="form-label">Responsavel</label>
                            <select class="form-select" id="responsavel" name="responsavel">
                                <option value="">Nao atribuido</option>
                            </select>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="prazo" class="form-label">Prazo de finalizacao</label>
                            <input type="date" class="form-control" id="prazo" name="prazo">
                            <div class="invalid-feedback" id="erroPrazo"></div>
                            <small class="text-muted">Nao pode ser feriado nacional.</small>
                        </div>

                        <div class="col-md-12">
                            <button type="submit" class="btn btn-primary">Salvar</button>
                            <a href="demandas.html" class="btn btn-secondary">Cancelar</a>
                        </div>

                    </div>
                </form>
            </div>
        </div>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="js/comum.js"></script>
    <script src="js/demanda-form-validacao.js"></script>
    <script src="js/demanda-form.js"></script>
</body>
</html>
